<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Collection</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MTG Collection</h1>
  <span id="summary">Loading…</span>
</header>

<div class="toolbar">
  <input id="f-search" type="search" placeholder="Search name, oracle text, type line, set…">
  <select id="f-finish" title="Finish">
    <option value="all">Finish: all</option>
    <option value="nonfoil">nonfoil</option>
    <option value="foil">foil</option>
  </select>
  <select id="f-condition" title="Condition">
    <option value="all">Condition: all</option>
    <option value="NM">NM</option>
    <option value="LP">LP</option>
    <option value="MP">MP</option>
    <option value="HP">HP</option>
    <option value="D">D</option>
  </select>
  <select id="f-set" title="Set"><option value="all">Set: all</option></select>
  <select id="f-rarity" title="Rarity"><option value="all">Rarity: all</option></select>
  <select id="f-lang" title="Language"><option value="all">Language: all</option></select>
  <select id="f-color" title="Color identity">
    <option value="all">Color: all</option>
    <option value="W">White</option>
    <option value="U">Blue</option>
    <option value="B">Black</option>
    <option value="R">Red</option>
    <option value="G">Green</option>
    <option value="C">Colorless</option>
  </select>
  <input id="f-cmc-min" type="number" min="0" step="1" placeholder="CMC ≥">
  <input id="f-cmc-max" type="number" min="0" step="1" placeholder="CMC ≤">
  <input id="f-price-min" type="number" min="0" step="any" placeholder="€ ≥">
  <input id="f-price-max" type="number" min="0" step="any" placeholder="€ ≤">
  <input id="f-copies" type="number" min="1" step="1" placeholder="Copies ≥">
  <select id="f-sort" title="Sort"></select>
  <button id="f-dir" title="Toggle sort direction">↑</button>
  <button id="f-reset" title="Reset filters">Reset</button>
</div>

<main>
  <div id="grid" class="grid"></div>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="modal-close" title="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
